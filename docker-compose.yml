version: "3.9"

services:

  # ════════════════════════════════════════════
  #  PostgreSQL
  # ════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: mdp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_diagnosis}
      POSTGRES_USER: ${POSTGRES_USER:-mdp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdp_pass_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - mdp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════
  #  Redis
  # ════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: mdp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - mdp_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      retries: 5

  # ════════════════════════════════════════════
  #  FastAPI Backend
  # ════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdp_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mdp_user}:${POSTGRES_PASSWORD:-mdp_pass_change_me}@postgres:5432/${POSTGRES_DB:-market_diagnosis}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    volumes:
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mdp_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 3

  # ════════════════════════════════════════════
  #  React Frontend
  # ════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: mdp_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mdp_net

  # ════════════════════════════════════════════
  #  Nginx (reverse proxy — single entry point)
  # ════════════════════════════════════════════
  nginx:
    image: nginx:1.25-alpine
    container_name: mdp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - mdp_net

  # ════════════════════════════════════════════
  #  Celery Worker
  # ════════════════════════════════════════════
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdp_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mdp_user}:${POSTGRES_PASSWORD:-mdp_pass_change_me}@postgres:5432/${POSTGRES_DB:-market_diagnosis}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    depends_on:
      - redis
      - postgres
    networks:
      - mdp_net

  # ════════════════════════════════════════════
  #  Celery Beat Scheduler
  # ════════════════════════════════════════════
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdp_celery_beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    depends_on:
      - redis
    networks:
      - mdp_net

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  nginx_logs:

networks:
  mdp_net:
    driver: bridge
